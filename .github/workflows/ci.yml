name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No provider credentials exist in CI. Paid providers are also switched off, and any
# outbound provider request fails the run instead of being silently handled.
env:
  PIXEL_PAID_PROVIDERS_ENABLED: "false"
  PIXEL_BLOCK_EXTERNAL_HTTP: "true"
  LLM_ENABLED: "false"
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install API dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --requirement apps/api/requirements.lock
      - name: Run API tests
        run: npm run test:api

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint:web
      - name: Unit tests (including the provider-boundary check)
        run: npm run test:web
      - name: Production build
        run: npm run build:web

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --requirement apps/api/requirements.lock
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
